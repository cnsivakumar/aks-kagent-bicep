name: Deploy kagent to AKS

on:

  push:
    branches:
      - main

    paths:
      - "k8s/**"
      - "kagent/**"
      - "scripts/**"
      - ".github/workflows/kagent-deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:

  RESOURCE_GROUP: rg-kagent-aks
  AKS_NAME: aks-kagent-demo

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------
      # Azure authentication
      # ----------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------
      # Get AKS credentials
      # ----------------------------------------

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_NAME \
            --overwrite-existing

      # ----------------------------------------
      # Verify cluster
      # ----------------------------------------

      - name: Verify AKS
        run: |
          kubectl version
          kubectl get nodes

      # ----------------------------------------
      # Install Helm
      # ----------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # ----------------------------------------
      # Install kubectl
      # ----------------------------------------

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # ----------------------------------------
      # Install jq
      # ----------------------------------------

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      # ----------------------------------------
      # Install Agent Substrate
      # ----------------------------------------

      - name: Install Agent Substrate
        run: |
          chmod +x scripts/install-substrate.sh
          ./scripts/install-substrate.sh

      # ----------------------------------------
      # Install kagent
      # ----------------------------------------

      - name: Deploy kagent
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          chmod +x scripts/install-kagent.sh
          ./scripts/install-kagent.sh

      # ----------------------------------------
      # Verify
      # ----------------------------------------

      - name: Verify kagent
        run: |

          echo "===== kagent pods ====="

          kubectl get pods \
            -n kagent \
            -o wide

          echo "===== substrate pods ====="

          kubectl get pods \
            -n ate-system \
            -o wide

          echo "===== WorkerPool ====="

          kubectl get workerpools \
            -n kagent

          echo "===== ModelConfig ====="

          kubectl get modelconfigs \
            -n kagent

          echo "===== AgentTemplate ====="

          kubectl get agenttemplates \
            -n kagent