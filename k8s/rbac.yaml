apiVersion: v1
kind: ServiceAccount
metadata:
  name: aks-assistant
  namespace: kagent

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aks-assistant-readonly

rules:

  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - namespaces
      - nodes
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aks-assistant-readonly

subjects:
  - kind: ServiceAccount
    name: aks-assistant
    namespace: kagent

roleRef:
  kind: ClusterRole
  name: aks-assistant-readonly
  apiGroup: rbac.authorization.k8s.io